<!DOCTYPE html>

<head>

  <!-- Bootstrap 5 Dark Theme -->

  <link href="css/style.css" rel="stylesheet">

<body style="background-image: url('img/coffee-bg.jpg'); background-size: cover;"></body>
  
  <div class="container py-4" id="main-container">


    
    <!-- Textarea and Model Selection -->
    <div class="card p-3 mb-3">
      <div class="mb-3">
        <!-- <label for="userInput" class="form-label">Otázka:</label> -->
      <div class="d-flex flex-wrap align-items-start gap-2">

        <div class="d-flex align-items-start gap-2">  
          <button id="micBtn" type="button" class="btn btn-outline-light">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                  <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0a7 7 0 0 1-6 6.93V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0a5 5 0 0 0 10 0Z"/>
                </svg>
            </button>
            <button id="aiBtn" type="button" class="btn btn-outline-light" onclick="fAskAI()">
              AI
          </button>
          <button id="favBtn" type="button" class="btn btn-outline-light" onClick="fFilterFavorites()">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
              </svg>
          </button>
        </div>
        <div class="flex-grow-1">
          <textarea id="userInput" class="form-control"  
           
          rows="1"
          >
        </textarea>
        
        </div>

        <div class="d-flex align-items-start gap-2">  
        
          <button id="searchBtn" type="button" class="btn btn-outline-light">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5a6.5 6.5 0 1 0-6.5 6.5c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5s4.5 2.01 4.5 4.5S12.99 14 10.5 14z"/>
              </svg>
          </button>
          <button id="gMailBtn" type="button" class="btn btn-outline-light">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm-1.5 3.5L12 11.99L5.5 7.5A.5.5 0 1 1 6.21 6.21L11.3 10.3a1.5 1.5 0 0 0 1.4-.01l5.09-4.09a.5.5 0 1 1 .7.7Z"/>
              </svg>
          </button>
        </div >
      </div>
      </div>
      
      <div class="d-flex flex-wrap align-items-start gap-2" id="searchBtns">
      </div>
    </div>

    <!-- films -->
    <div class="card p-3" style="height: min-content;">
      <!-- <div class="statusBox" id="statusBox"></div> -->
      <div id="cardsWrap" class="cards-wrap"></div>
    </div>

  </div>
